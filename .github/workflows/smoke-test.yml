name: Smoke test

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:


jobs:

  setup-database:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
          cache: "pip"

      - name: Install dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install .

      - name: Initialize database
        id: initialize-database
        # A new cluster has exactly one user, admin, which is why that name is
        # fixed everywhere below. The project is named here rather than read
        # from a repo variable so the deployment target is visible in the
        # workflow and does not depend on repository settings.
        #
        # POST /v2/clusters generates its own admin password and ignores any
        # that is sent, so the script resets it to CLUSTER_PASSWORD over SQL
        # once the cluster is up. That keeps the credential a secret the runner
        # masks everywhere, instead of a job output: the runner refuses to write
        # an output whose value is masked, so a generated password could not
        # reach these jobs at all.
        run: |
          python resources/create_test_cluster.py --password="${{ secrets.CLUSTER_PASSWORD }}" --token="${{ secrets.CLUSTER_API_KEY }}" --project="Standard Project" --init-sql singlestoredb/tests/test.sql --output=github --expires=2h "python - $GITHUB_WORKFLOW - $GITHUB_RUN_NUMBER"
        env:
          PYTHONPATH: ${{ github.workspace }}

    outputs:
      cluster-id: ${{ steps.initialize-database.outputs.cluster-id }}
      cluster-host: ${{ steps.initialize-database.outputs.cluster-host }}
      cluster-database: ${{ steps.initialize-database.outputs.cluster-database }}


  smoke-test:
    needs: setup-database

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-24.04
        # Every version from the floor in pyproject.toml (requires-python
        # >=3.9) up to the newest final release. 3.15 is deliberately absent:
        # as of 2026-09-18 it is at rc2 with GA planned for 2026-10-01, and
        # setup-python needs allow-prereleases plus an explicit "3.15.0-rc.2"
        # to install it at all. Add a bare "3.15" once it ships.
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        driver:
          - mysql
          - https
        pure-python:
          - 0
        buffered:
          - 1
        # Manually include a few runs of specific configurations
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
            driver: mysql
            pure-python: 1
            buffered: 1
#         - os: ubuntu-24.04
#           python-version: "3.11"
#           driver: mysql
#           pure-python: 1
#           buffered: 0
#         - os: ubuntu-24.04
#           python-version: "3.11"
#           driver: mysql
#           pure-python: 0
#           buffered: 0
          - os: macos-latest
            python-version: "3.11"
            driver: mysql
            pure-python: 0
            buffered: 1
          - os: macos-latest
            python-version: "3.11"
            driver: https
            pure-python: 0
            buffered: 1
          - os: windows-latest
            python-version: "3.11"
            driver: mysql
            pure-python: 0
            buffered: 1
          - os: windows-latest
            python-version: "3.11"
            driver: https
            pure-python: 0
            buffered: 1

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        if: ${{ matrix.driver != 'https' }}
        run: pytest -v --pyargs singlestoredb.tests.test_basics
        env:
          PYTHONPATH: ${{ github.workspace }}
          # CLUSTER_PASSWORD goes into the userinfo half of a URL here, so it
          # has to be free of characters that would need percent-encoding --
          # ':', '@', '/', '%' and the like. Keep the secret alphanumeric.
          SINGLESTOREDB_URL: "${{ matrix.driver }}://admin:${{ secrets.CLUSTER_PASSWORD }}@${{ needs.setup-database.outputs.cluster-host }}:3306/${{ needs.setup-database.outputs.cluster-database }}?pure_python=${{ matrix.pure-python }}&buffered=${{ matrix.buffered }}"

      - name: Run tests
        if: ${{ matrix.driver == 'https' }}
        # -n 0 overrides the -n 3 in pyproject.toml's addopts: the Data API is
        # not run in parallel. This job avoids the `RESTART PROXY` hazard the
        # code-check/coverage HTTP steps hit -- no SINGLESTOREDB_INIT_DB_URL
        # here, so load_sql's setup connection is itself HTTP and skips that
        # branch -- but the driver is the same one, so it gets the same
        # treatment rather than being the lone parallel Data API run.
        run: pytest -v -n 0 --pyargs singlestoredb.tests.test_basics
        env:
          PYTHONPATH: ${{ github.workspace }}
          SINGLESTOREDB_URL: "${{ matrix.driver }}://admin:${{ secrets.CLUSTER_PASSWORD }}@${{ needs.setup-database.outputs.cluster-host }}:443/${{ needs.setup-database.outputs.cluster-database }}?pure_python=${{ matrix.pure-python }}&buffered=${{ matrix.buffered }}"


  shutdown-database:
    needs: [setup-database, smoke-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
          cache: "pip"

      - name: Install dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install .

      - name: Drop database
        if: ${{ always() }}
        # The password reaches the script through the environment rather than
        # being interpolated into the command, so the shell never sees its
        # characters.
        run: |
          python resources/drop_db.py --user admin --password "$CLUSTER_PASSWORD" --host "$CLUSTER_HOST" --port 3306 --database "$CLUSTER_DATABASE"
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLUSTER_PASSWORD: ${{ secrets.CLUSTER_PASSWORD }}
          CLUSTER_HOST: ${{ needs.setup-database.outputs.cluster-host }}
          CLUSTER_DATABASE: ${{ needs.setup-database.outputs.cluster-database }}

      - name: Shutdown cluster
        if: ${{ always() }}
        # An empty ID would send the DELETE to /v2/clusters/ and leave a live
        # cluster behind, so say so loudly instead: at that point the ID has to
        # be recovered by hand. --fail-with-body is what makes a refused DELETE
        # fail this step rather than printing the error and exiting 0.
        run: |
          if [ -z "$CLUSTER_ID" ]; then
            echo "::error::No cluster ID from setup-database; the cluster (if any) must be terminated by hand"
            exit 1
          fi
          curl --fail-with-body -H "Accept: application/json" -H "Authorization: Bearer ${{ secrets.CLUSTER_API_KEY }}" -X DELETE "https://api.singlestore.com/v2/clusters/$CLUSTER_ID?force=true"
        env:
          CLUSTER_ID: ${{ needs.setup-database.outputs.cluster-id }}
