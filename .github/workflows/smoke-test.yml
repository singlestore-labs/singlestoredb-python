name: Smoke test

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:


jobs:

  setup-database:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: "pip"

      - name: Install dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install .

      - name: Initialize database
        id: initialize-database
        # A new cluster has exactly one user, admin, which is why that name is
        # fixed everywhere below. The project is named here rather than read
        # from a repo variable so the deployment target is visible in the
        # workflow and does not depend on repository settings.
        run: |
          python resources/create_test_cluster.py --token="${{ secrets.CLUSTER_API_KEY }}" --project="Standard Project" --init-sql singlestoredb/tests/test.sql --output=github --expires=2h "python - $GITHUB_WORKFLOW - $GITHUB_RUN_NUMBER"
        env:
          PYTHONPATH: ${{ github.workspace }}

    outputs:
      cluster-id: ${{ steps.initialize-database.outputs.cluster-id }}
      cluster-host: ${{ steps.initialize-database.outputs.cluster-host }}
      cluster-database: ${{ steps.initialize-database.outputs.cluster-database }}
      # POST /v2/clusters generates the admin password and reports it only on
      # the create response, so it travels as a job output rather than living
      # in secrets. Job outputs are not secrets: every job below re-masks it.
      cluster-password: ${{ steps.initialize-database.outputs.cluster-password }}
      cluster-password-url: ${{ steps.initialize-database.outputs.cluster-password-url }}


  smoke-test:
    needs: setup-database

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-24.04
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        driver:
          - mysql
          - https
        pure-python:
          - 0
        buffered:
          - 1
        # Manually include a few runs of specific configurations
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
            driver: mysql
            pure-python: 1
            buffered: 1
#         - os: ubuntu-24.04
#           python-version: "3.11"
#           driver: mysql
#           pure-python: 1
#           buffered: 0
#         - os: ubuntu-24.04
#           python-version: "3.11"
#           driver: mysql
#           pure-python: 0
#           buffered: 0
          - os: macos-latest
            python-version: "3.11"
            driver: mysql
            pure-python: 0
            buffered: 1
          - os: macos-latest
            python-version: "3.11"
            driver: https
            pure-python: 0
            buffered: 1
          - os: windows-latest
            python-version: "3.11"
            driver: mysql
            pure-python: 0
            buffered: 1
          - os: windows-latest
            python-version: "3.11"
            driver: https
            pure-python: 0
            buffered: 1

    steps:
      # ::add-mask:: does not cross job boundaries, so the generated admin
      # password arrives here unmasked and has to be registered again before
      # any step can echo it into the log.
      - name: Mask cluster password
        env:
          CLUSTER_PASSWORD: ${{ needs.setup-database.outputs.cluster-password }}
          CLUSTER_PASSWORD_URL: ${{ needs.setup-database.outputs.cluster-password-url }}
        run: |
          echo "::add-mask::$CLUSTER_PASSWORD"
          echo "::add-mask::$CLUSTER_PASSWORD_URL"

      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        if: ${{ matrix.driver != 'https' }}
        run: pytest -v --pyargs singlestoredb.tests.test_basics
        env:
          PYTHONPATH: ${{ github.workspace }}
          # cluster-password-url, not cluster-password: the generated password
          # is drawn from the full printable set and has to be percent-encoded
          # to survive the userinfo half of the URL.
          SINGLESTOREDB_URL: "${{ matrix.driver }}://admin:${{ needs.setup-database.outputs.cluster-password-url }}@${{ needs.setup-database.outputs.cluster-host }}:3306/${{ needs.setup-database.outputs.cluster-database }}?pure_python=${{ matrix.pure-python }}&buffered=${{ matrix.buffered }}"

      - name: Run tests
        if: ${{ matrix.driver == 'https' }}
        # -n 0 overrides the -n 3 in pyproject.toml's addopts: the Data API is
        # not run in parallel. This job avoids the `RESTART PROXY` hazard the
        # code-check/coverage HTTP steps hit -- no SINGLESTOREDB_INIT_DB_URL
        # here, so load_sql's setup connection is itself HTTP and skips that
        # branch -- but the driver is the same one, so it gets the same
        # treatment rather than being the lone parallel Data API run.
        run: pytest -v -n 0 --pyargs singlestoredb.tests.test_basics
        env:
          PYTHONPATH: ${{ github.workspace }}
          SINGLESTOREDB_URL: "${{ matrix.driver }}://admin:${{ needs.setup-database.outputs.cluster-password-url }}@${{ needs.setup-database.outputs.cluster-host }}:443/${{ needs.setup-database.outputs.cluster-database }}?pure_python=${{ matrix.pure-python }}&buffered=${{ matrix.buffered }}"


  shutdown-database:
    needs: [setup-database, smoke-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      # ::add-mask:: does not cross job boundaries; see the smoke-test job.
      - name: Mask cluster password
        env:
          CLUSTER_PASSWORD: ${{ needs.setup-database.outputs.cluster-password }}
          CLUSTER_PASSWORD_URL: ${{ needs.setup-database.outputs.cluster-password-url }}
        run: |
          echo "::add-mask::$CLUSTER_PASSWORD"
          echo "::add-mask::$CLUSTER_PASSWORD_URL"

      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: "pip"

      - name: Install dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install .

      - name: Drop database
        if: ${{ always() }}
        # The password reaches the script through the environment rather than
        # being interpolated into the command: the generated value can contain
        # any printable character, including ones the shell would act on.
        run: |
          python resources/drop_db.py --user admin --password "$CLUSTER_PASSWORD" --host "$CLUSTER_HOST" --port 3306 --database "$CLUSTER_DATABASE"
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLUSTER_PASSWORD: ${{ needs.setup-database.outputs.cluster-password }}
          CLUSTER_HOST: ${{ needs.setup-database.outputs.cluster-host }}
          CLUSTER_DATABASE: ${{ needs.setup-database.outputs.cluster-database }}

      - name: Shutdown cluster
        if: ${{ always() }}
        run: |
          curl -H "Accept: application/json" -H "Authorization: Bearer ${{ secrets.CLUSTER_API_KEY }}" -X DELETE "https://api.singlestore.com/v2/clusters/${{ env.CLUSTER_ID }}?force=true"
        env:
          CLUSTER_ID: ${{ needs.setup-database.outputs.cluster-id }}
