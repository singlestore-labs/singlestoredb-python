name: Coverage tests

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    environment: Base

    # One ledger for the whole job, so the cleanup step below can reap what any
    # of the pytest steps created. Per job rather than shared: each job gets its
    # own runner and workspace anyway, and keeping the ledgers separate means a
    # job's sweep can only ever reach records it wrote itself.
    env:
      SINGLESTOREDB_TEST_DEPLOYMENT_LOG: ${{ github.workspace }}/deployments.jsonl

    services:
      singlestore:
        image: ghcr.io/singlestore-labs/singlestoredb-dev:latest
        ports:
          - 3307:3306
          - 8081:8080
          - 9081:9081
        env:
          SINGLESTORE_LICENSE: ${{ secrets.SINGLESTORE_LICENSE }}
          ROOT_PASSWORD: "root"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run MySQL protocol tests
        # -m 'not management_v1' keeps the v2 management coverage while dropping
        # the deprecated v1 suite; the management-v1-tests job below is where
        # that runs.
        run: |
          pytest -v -m 'not management_v1' --cov=singlestoredb --pyargs singlestoredb.tests
        env:
          COVERAGE_FILE: "coverage-mysql.cov"
          SINGLESTOREDB_URL: "root:root@127.0.0.1:3307"
          SINGLESTOREDB_PURE_PYTHON: 0
          SINGLESTORE_LICENSE: ${{ secrets.SINGLESTORE_LICENSE }}
          SINGLESTOREDB_MANAGEMENT_TOKEN: ${{ secrets.CLUSTER_API_KEY }}
          SINGLESTOREDB_FUSION_ENABLE_HIDDEN: "1"

      - name: Run MySQL protocol tests (pure Python)
        run: |
          pytest -v -m 'not management' --cov=singlestoredb --pyargs singlestoredb.tests
        env:
          COVERAGE_FILE: "coverage-mysql-py.cov"
          SINGLESTOREDB_URL: "root:root@127.0.0.1:3307"
          SINGLESTOREDB_PURE_PYTHON: 1
          SINGLESTORE_LICENSE: ${{ secrets.SINGLESTORE_LICENSE }}
          SINGLESTOREDB_MANAGEMENT_TOKEN: ${{ secrets.CLUSTER_API_KEY }}
          SINGLESTOREDB_FUSION_ENABLE_HIDDEN: "1"

      - name: Run HTTP protocol tests
        # -n 0 overrides the -n 2 in pyproject.toml's addopts: the HTTP/Data API
        # run must be serial. Setup goes over SINGLESTOREDB_INIT_DB_URL (MySQL),
        # so load_sql takes its `SET GLOBAL HTTP_PROXY_PORT` + `RESTART PROXY`
        # branch (singlestoredb/tests/utils.py:227) once per worker, and a proxy
        # restart drops any HTTP request another worker has in flight.
        run: |
          pytest -v -n 0 -m 'not management' --cov=singlestoredb --pyargs singlestoredb.tests
        env:
          COVERAGE_FILE: "coverage-http.cov"
          SINGLESTOREDB_URL: "http://root:root@127.0.0.1:9081"
          SINGLESTORE_LICENSE: ${{ secrets.SINGLESTORE_LICENSE }}
          SINGLESTOREDB_MANAGEMENT_TOKEN: ${{ secrets.CLUSTER_API_KEY }}
          # Can not change databases using HTTP API. The URL below will be
          # used to create the database and the generated database name will
          # be applied to the above URL.
          SINGLESTOREDB_INIT_DB_URL: "root:root@127.0.0.1:3307"
          SINGLESTOREDB_FUSION_ENABLE_HIDDEN: "1"

      - name: Generate report
        run: |
          coverage combine coverage-mysql.cov coverage-http.cov coverage-mysql-py.cov
          coverage report
          coverage xml
          coverage html

      # if: always() is the whole point -- this has to run when the job is
      # cancelled, which is the case that produced the leak. Run 35631802648
      # was cancelled 19 minutes into TestClusterFusion.setUpClass's
      # create_cluster(wait_on_active=True, wait_timeout=1200); the log ends at
      # '##[error]The operation was canceled.' with no pytest summary and no
      # sweep output, so three clusters were left billing with nothing in the
      # process having recorded them. The ledger is that record.
      #
      # Last step in the job so it covers every pytest step above it. Placing
      # it after each one instead would add nothing: a cancellation anywhere
      # still runs the remaining always() steps.
      #
      # What always() does not buy is unlimited time. GitHub force-terminates a
      # cancelled job's remaining steps after a 5-minute cancellation timeout,
      # and an S-00 cluster refuses DELETE until it is ACTIVE (~460s). The leak
      # above is covered because it was cancelled 19 minutes in, well past that;
      # a cancel in the first several minutes would be killed here still being
      # told 400/409, and needs `cleanup_deployments.py --older-than` run by
      # hand afterwards.
      - name: Terminate any deployment the tests left behind
        if: always()
        run: |
          python -m singlestoredb.tests.cleanup_deployments \
            --ledger "$SINGLESTOREDB_TEST_DEPLOYMENT_LOG" --yes
        env:
          SINGLESTOREDB_MANAGEMENT_TOKEN: ${{ secrets.CLUSTER_API_KEY }}

  # The deprecated v1 management API. management.version defaults to v2, so this
  # is a legacy gate: it runs here nightly rather than on every PR, and it is
  # what gets deleted along with management/v1/. Selects both the mocked v1
  # units and the live v1 deployments, plus test_fusion's v1 WORKSPACE grammar.
  management-v1-tests:
    runs-on: ubuntu-latest
    environment: Base

    # Waits for test-coverage rather than running alongside it, so the v1
    # workspace groups are never in flight at the same time as the v2 suite's
    # cluster pool -- together they put more on the org than it wants to carry.
    # This is a nightly cron, so the extra wall clock costs nothing.
    #
    # Runs even when test-coverage fails, because this is a legacy gate, not a
    # downstream build: a v2 failure above says nothing about the v1 endpoints,
    # and skipping v1 for it would hide a v1 regression behind an unrelated one.
    #
    # !cancelled() rather than always(), which stays true through cancellation
    # too. A cancelled run must not go on to start provisioning workspace groups
    # here: GitHub force-terminates a cancelled job's remaining steps after a
    # 5-minute cancellation timeout, so the ledger sweep below would be killed
    # while the new deployments were still pre-ACTIVE and refusing DELETE -- the
    # job would strand exactly what it was added to clean up.
    needs: test-coverage
    if: ${{ !cancelled() }}

    # A ledger of its own, not shared with test-coverage. The jobs no longer
    # overlap, but they still run on separate runners with separate workspaces,
    # and keeping the ledgers distinct means neither job's sweep can reach the
    # other's records.
    env:
      SINGLESTOREDB_TEST_DEPLOYMENT_LOG: ${{ github.workspace }}/deployments.jsonl

    services:
      singlestore:
        image: ghcr.io/singlestore-labs/singlestoredb-dev:latest
        ports:
          - 3307:3306
          - 8081:8080
          - 9081:9081
        env:
          SINGLESTORE_LICENSE: ${{ secrets.SINGLESTORE_LICENSE }}
          ROOT_PASSWORD: "root"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run v1 management API tests
        # -n 0 overrides the -n 2 in pyproject.toml's addopts. The parallel
        # default is tuned for the v2 management suite's shared cluster pool; the
        # v1 classes deploy workspace groups of their own, so two workers here
        # put twice that in flight, on top of whatever the v2 job is holding at
        # the same time. Serial keeps this job's contribution to the org's
        # cluster count to one deployment at a time.
        run: |
          pytest -v -n 0 -m 'management_v1' --pyargs singlestoredb.tests
        env:
          SINGLESTOREDB_URL: "root:root@127.0.0.1:3307"
          SINGLESTOREDB_PURE_PYTHON: 0
          SINGLESTORE_LICENSE: ${{ secrets.SINGLESTORE_LICENSE }}
          SINGLESTOREDB_MANAGEMENT_TOKEN: ${{ secrets.CLUSTER_API_KEY }}
          SINGLESTOREDB_FUSION_ENABLE_HIDDEN: "1"

      # See the matching step in test-coverage for why this is if: always().
      # The v1 suite deploys workspace groups, which are the kind that force
      # exists for.
      - name: Terminate any deployment the tests left behind
        if: always()
        run: |
          python -m singlestoredb.tests.cleanup_deployments \
            --ledger "$SINGLESTOREDB_TEST_DEPLOYMENT_LOG" --yes
        env:
          SINGLESTOREDB_MANAGEMENT_TOKEN: ${{ secrets.CLUSTER_API_KEY }}
