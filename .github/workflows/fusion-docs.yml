on:
  release:
    types: [published]

name: Generate Fusion docs

jobs:

  docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v7

      # Only drives resources/gen_fusion_handlers_doc.py, so this tracks the
      # newest final release rather than anything the package supports.
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install .

      - name: Build Fusion docs
        run: |
          python resources/gen_fusion_handlers_doc.py --dir fusion-docs
          zip -r fusion-docs.zip fusion-docs

      # The tag goes through the environment, not into the script, so the
      # shell never runs characters in it; see publish.yml.
      - name: Upload release asset
        run: |
          gh release upload "$TAG" fusion-docs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
