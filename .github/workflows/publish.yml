
#
# This workflow depends heavily on cibuildwheels.
# https://cibuildwheel.readthedocs.io/en/stable/
#

name: Publish packages

on:
  push:
    tags:
      - 'v*-rc*'
      - 'v*-test*'
      - 'v*-alpha*'
      - 'v*-beta*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish PyPI packages on success?"
        required: true
        type: boolean
        default: true
#     publish_anaconda:
#       description: "Publish Anaconda packages on success?"
#       required: true
#       type: boolean
#       default: true
      build_number:
        description: "Package build number"
        required: true
        type: string
        default: 0

jobs:

  setup-database:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install .

      - name: Initialize database
        id: initialize-database
        # A new cluster has exactly one user, admin, which is why that name is
        # fixed everywhere below. The project is named here rather than read
        # from a repo variable so the deployment target is visible in the
        # workflow and does not depend on repository settings.
        #
        # POST /v2/clusters generates its own admin password and ignores any
        # that is sent, so the script resets it to CLUSTER_PASSWORD over SQL
        # once the cluster is up. That keeps the credential a secret the runner
        # masks everywhere, instead of a job output: the runner refuses to write
        # an output whose value is masked, so a generated password could not
        # reach these jobs at all.
        run: |
          python resources/create_test_cluster.py --password="${{ secrets.CLUSTER_PASSWORD }}" --token="${{ secrets.CLUSTER_API_KEY }}" --project="Standard Project" --init-sql singlestoredb/tests/test.sql --output=github --expires=2h "python - $GITHUB_WORKFLOW - $GITHUB_RUN_NUMBER"
        env:
          PYTHONPATH: ${{ github.workspace }}

    outputs:
      cluster-id: ${{ steps.initialize-database.outputs.cluster-id }}
      cluster-host: ${{ steps.initialize-database.outputs.cluster-host }}
      cluster-database: ${{ steps.initialize-database.outputs.cluster-database }}

  build-and-test:
    needs: setup-database

    name: Build and test wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022

    steps:
      - uses: actions/checkout@v7

      # This job's matrix varies only over os; cibuildwheel supplies its own
      # interpreters, so 3.10 here is just the host Python that drives it.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build sdist
        if: runner.os == 'Linux'
        run: |
          python -m build --sdist --no-isolation

      - name: Build pure Python package
        if: runner.os == 'Linux'
        run: |
          python -m build --wheel --no-isolation
        env:
          SINGLESTOREDB_BUILD_EXTENSION: "0"

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v2.16.5
        env:
          # configure cibuildwheel to build native archs ('auto'), and some
          # emulated ones
          CIBW_ARCHS_LINUX: "auto aarch64"
          CIBW_ARCHS_MACOS: "universal2"
          CIBW_BUILD: "cp39-*"
          CIBW_SKIP: "pp* *-musllinux* *-manylinux_i686"
          CIBW_TEST_COMMAND: "pytest -v --pyargs singlestoredb.tests.test_basics"
          # xdist because pyproject.toml's addopts sets -n/--dist, and PYTHONPATH
          # points --pyargs at the workspace, so that pyproject is the inifile
          # here. Without the plugin pytest exits on the unknown arguments.
          CIBW_TEST_REQUIRES: "pytest pytest-xdist"
          # CLUSTER_PASSWORD has to survive both the userinfo half of the URL
          # and the single-quoted shell word cibuildwheel evaluates, so keep the
          # secret alphanumeric: no ':', '@', '/', '%' or quote characters.
          CIBW_ENVIRONMENT: "SINGLESTOREDB_URL='mysql://admin:${{ secrets.CLUSTER_PASSWORD }}@${{ needs.setup-database.outputs.cluster-host }}:3306/${{ needs.setup-database.outputs.cluster-database }}?pure_python=0'"
          PYTHONPATH: ${{ github.workspace }}

#     - name: Build conda
#       if: ${{ matrix.os != 'windows-latest' }}
#       run: |
#         # $CONDA is an environment variable pointing to the root of the miniconda directory
#         echo $CONDA/bin >> $GITHUB_PATH
#         conda update conda
#         conda install conda-build anaconda-client conda-verify
#         mkdir conda-bld
#         cd conda.recipe
#         conda build -c singlestore -c conda-forge --output-folder ../conda-bld --no-test --no-anaconda-upload .

#     - name: Build conda (Windows)
#       if: ${{ matrix.os == 'windows-latest' }}
#       run: |
#         C:\Miniconda\condabin\conda.bat update conda
#         C:\Miniconda\condabin\conda.bat install conda-build anaconda-client conda-verify
#         mkdir conda-bld
#         cd conda.recipe
#         C:\Miniconda\condabin\conda.bat build -c singlestore -c conda-forge --output-folder ../conda-bld --no-test --no-anaconda-upload .

      - name: Merge wheels and sdist
        run: |
          mkdir -p dist
          mv ./wheelhouse/*.whl ./dist/.

      - name: Archive source dist and wheel
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ runner.os }}
          path: dist
          retention-days: 2

#    - name: Archive conda
#       uses: actions/upload-artifact@v7
#       with:
#         name: conda-${{ matrix.os }}
#         path: ./conda-bld
#         retention-days: 2

  publish:
    needs: build-and-test

    runs-on: ubuntu-latest

    permissions:
      id-token: write   # Required for OIDC trusted publishing
      actions: read     # Required for actions/download-artifact
      contents: write   # Required for gh release create/upload

    environment:
      name: publish
      url: https://pypi.org/p/singlestoredb

    steps:
      - uses: actions/checkout@v7

      - name: Download Linux wheels and sdist
        uses: actions/download-artifact@v8
        with:
          name: artifacts-Linux
          path: dist

      - name: Download Windows wheels and sdist
        uses: actions/download-artifact@v8
        with:
          name: artifacts-Windows
          path: dist

      - name: Download Mac wheels and sdist
        uses: actions/download-artifact@v8
        with:
          name: artifacts-macOS
          path: dist

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' }}
        run: |
          gh release create ${{ github.ref_name }} dist/* --prerelease --title "${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        if: ${{ github.event_name == 'release' }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: ${{ github.event_name == 'release' || github.event.inputs.publish_pypi == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1

#     - name: Publish Conda package
#       if: ${{ github.event_name == 'release' || github.event.inputs.publish_anaconda == 'true' }}
#       env:
#         PACKAGE_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
#       run: |
#         echo $CONDA/bin >> $GITHUB_PATH
#         anaconda -t "${{ secrets.ANACONDA_TOKEN }}" upload --no-progress --user SingleStore --label main conda-bld/*/singlestoredb-*.tar.bz2
#

  shutdown-database:
    needs: [setup-database, build-and-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install .

      - name: Drop database
        if: ${{ always() }}
        # The password reaches the script through the environment rather than
        # being interpolated into the command, so the shell never sees its
        # characters.
        run: |
          python resources/drop_db.py --user admin --password "$CLUSTER_PASSWORD" --host "$CLUSTER_HOST" --port 3306 --database "$CLUSTER_DATABASE"
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLUSTER_PASSWORD: ${{ secrets.CLUSTER_PASSWORD }}
          CLUSTER_HOST: ${{ needs.setup-database.outputs.cluster-host }}
          CLUSTER_DATABASE: ${{ needs.setup-database.outputs.cluster-database }}

      - name: Shutdown cluster
        if: ${{ always() }}
        run: |
          curl -H "Accept: application/json" -H "Authorization: Bearer ${{ secrets.CLUSTER_API_KEY }}" -X DELETE "https://api.singlestore.com/v2/clusters/${{ env.CLUSTER_ID }}?force=true"
        env:
          CLUSTER_ID: ${{ needs.setup-database.outputs.cluster-id }}
