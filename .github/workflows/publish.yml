
#
# This workflow depends heavily on cibuildwheels.
# https://cibuildwheel.readthedocs.io/en/stable/
#

name: Publish packages

on:
  push:
    tags:
      - 'v*-rc*'
      - 'v*-test*'
      - 'v*-alpha*'
      - 'v*-beta*'
  release:
    types: [published]
  # Build and test, but never publish, when packaging changes, so a broken
  # release pipeline is caught in review rather than at release time.
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - 'accel.c'
      - 'setup.py'
      - 'setup.cfg'
      - 'pyproject.toml'
      - 'MANIFEST.in'
  # Runner images and cibuildwheel's toolchains are retired out from under the
  # workflow with no change to this repo, so build and test weekly as well.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish PyPI packages on success?"
        required: true
        type: boolean
        default: true
#     publish_anaconda:
#       description: "Publish Anaconda packages on success?"
#       required: true
#       type: boolean
#       default: true
      build_number:
        description: "Package build number"
        required: true
        type: string
        default: 0

jobs:

  setup-database:
    # Pull requests from forks get no secrets, so they cannot deploy the test
    # cluster.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # Pinned, not ubuntu-latest: that label is moving to Ubuntu 26.04, and
    # this job, publish and shutdown-database run on the image's own Python
    # rather than one from setup-python, so the move would change it under
    # them. The weekly scheduled run flags this image's retirement.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install .

      - name: Initialize database
        id: initialize-database
        # A new cluster has exactly one user, admin, hence the fixed name below.
        # The project is named here, not in a repo variable, so the deployment
        # target is visible in the workflow.
        #
        # POST /v2/clusters generates its own admin password and ignores any sent
        # to it, so the script resets it to CLUSTER_PASSWORD over SQL once the
        # cluster is up. A generated password could not reach the other jobs
        # anyway: the runner refuses to write a masked value as a job output.
        run: |
          python resources/create_test_cluster.py --password="${{ secrets.CLUSTER_PASSWORD }}" --token="${{ secrets.CLUSTER_API_KEY }}" --project="Standard Project" --init-sql singlestoredb/tests/test.sql --output=github --expires=2h "python - $GITHUB_WORKFLOW - $GITHUB_RUN_NUMBER"
        env:
          PYTHONPATH: ${{ github.workspace }}

    outputs:
      cluster-id: ${{ steps.initialize-database.outputs.cluster-id }}
      cluster-host: ${{ steps.initialize-database.outputs.cluster-host }}
      cluster-database: ${{ steps.initialize-database.outputs.cluster-database }}

  build-and-test:
    needs: setup-database
    # setup-database is skipped only for a fork's pull request, which has no
    # secrets. Those runs still build every wheel and check that its extension
    # loads; only the cluster tests are left out.
    if: ${{ !cancelled() && (needs.setup-database.result == 'success' || needs.setup-database.result == 'skipped') }}

    name: Build and test wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2022

    steps:
      - uses: actions/checkout@v7

      # This job's matrix varies only over os; cibuildwheel supplies its own
      # interpreters, so 3.14 here is just the host Python that drives it.
      # Host-only pins track the newest final release rather than the floor.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build sdist
        if: runner.os == 'Linux'
        run: |
          python -m build --sdist --no-isolation

      - name: Build pure Python package
        if: runner.os == 'Linux'
        run: |
          python -m build --wheel --no-isolation
        env:
          SINGLESTOREDB_BUILD_EXTENSION: "0"

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.3
        env:
          # configure cibuildwheel to build native archs ('auto'), and some
          # emulated ones
          CIBW_ARCHS_LINUX: "auto aarch64"
          CIBW_ARCHS_MACOS: "universal2"
          # The wheel is abi3, so it is built once on cp39. cibuildwheel skips
          # the build for cp315 because the abi3 wheel already covers it, and
          # only reruns the tests there, so the oldest and newest supported
          # interpreters both load the extension.
          CIBW_BUILD: "cp39-* cp315-*"
          CIBW_SKIP: "*-musllinux* *-manylinux_i686"
          # cibuildwheel v3+ builds on manylinux_2_28 (glibc 2.28) by default.
          # Pin manylinux2014 (glibc 2.17) so CentOS/RHEL 7, Amazon Linux 2 and
          # Ubuntu 18.04 still get the C extension instead of falling back to
          # the pure-Python wheel without any warning.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_TEST_COMMAND: ${{ needs.setup-database.result == 'success' && 'pytest -v --pyargs singlestoredb.tests.test_basics' || 'python -c "import _singlestoredb_accel, singlestoredb"' }}
          CIBW_TEST_REQUIRES: "pytest"
          # CLUSTER_PASSWORD has to survive both the userinfo half of the URL
          # and the single-quoted shell word cibuildwheel evaluates, so keep the
          # secret alphanumeric: no ':', '@', '/', '%' or quote characters.
          CIBW_ENVIRONMENT: "SINGLESTOREDB_URL='mysql://admin:${{ secrets.CLUSTER_PASSWORD }}@${{ needs.setup-database.outputs.cluster-host }}:3306/${{ needs.setup-database.outputs.cluster-database }}?pure_python=0'"
          # No PYTHONPATH here: it would put the checkout ahead of the installed
          # wheel, so the tests would import the checkout's singlestoredb and the
          # extension that `pip install -e` built in place for the host Python,
          # not the wheel under test. On Windows the 64-bit host's extension
          # then fails to load in the 32-bit test interpreter.

#     - name: Build conda
#       if: ${{ matrix.os != 'windows-latest' }}
#       run: |
#         # $CONDA is an environment variable pointing to the root of the miniconda directory
#         echo $CONDA/bin >> $GITHUB_PATH
#         conda update conda
#         conda install conda-build anaconda-client conda-verify
#         mkdir conda-bld
#         cd conda.recipe
#         conda build -c singlestore -c conda-forge --output-folder ../conda-bld --no-test --no-anaconda-upload .

#     - name: Build conda (Windows)
#       if: ${{ matrix.os == 'windows-latest' }}
#       run: |
#         C:\Miniconda\condabin\conda.bat update conda
#         C:\Miniconda\condabin\conda.bat install conda-build anaconda-client conda-verify
#         mkdir conda-bld
#         cd conda.recipe
#         C:\Miniconda\condabin\conda.bat build -c singlestore -c conda-forge --output-folder ../conda-bld --no-test --no-anaconda-upload .

      - name: Merge wheels and sdist
        run: |
          mkdir -p dist
          mv ./wheelhouse/*.whl ./dist/.

      - name: Archive source dist and wheel
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ runner.os }}
          path: dist
          retention-days: 2

#    - name: Archive conda
#       uses: actions/upload-artifact@v7
#       with:
#         name: conda-${{ matrix.os }}
#         path: ./conda-bld
#         retention-days: 2

  publish:
    needs: build-and-test
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' }}

    # Pinned for the same reason as setup-database.
    runs-on: ubuntu-24.04

    permissions:
      id-token: write      # Required for OIDC trusted publishing and actions/attest
      actions: read        # Required for actions/download-artifact
      contents: write      # Required for gh release create/upload
      attestations: write  # Required for actions/attest

    environment:
      name: publish
      url: https://pypi.org/p/singlestoredb

    steps:
      - uses: actions/checkout@v7

      - name: Download Linux wheels and sdist
        uses: actions/download-artifact@v8
        with:
          name: artifacts-Linux
          path: dist

      - name: Download Windows wheels and sdist
        uses: actions/download-artifact@v8
        with:
          name: artifacts-Windows
          path: dist

      - name: Download Mac wheels and sdist
        uses: actions/download-artifact@v8
        with:
          name: artifacts-macOS
          path: dist

      # Signed SLSA build provenance for the files attached to the GitHub
      # Release, which otherwise carry nothing to verify them against. PyPI's
      # copies get their own attestations from gh-action-pypi-publish.
      # Verify with: gh attestation verify FILE --repo singlestore-labs/singlestoredb-python
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' }}
        run: |
          gh release create ${{ github.ref_name }} dist/* --prerelease --title "${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        if: ${{ github.event_name == 'release' }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: ${{ github.event_name == 'release' || github.event.inputs.publish_pypi == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1

#     - name: Publish Conda package
#       if: ${{ github.event_name == 'release' || github.event.inputs.publish_anaconda == 'true' }}
#       env:
#         PACKAGE_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
#       run: |
#         echo $CONDA/bin >> $GITHUB_PATH
#         anaconda -t "${{ secrets.ANACONDA_TOKEN }}" upload --no-progress --user SingleStore --label main conda-bld/*/singlestoredb-*.tar.bz2
#

  shutdown-database:
    needs: [setup-database, build-and-test]
    # Not when setup-database was skipped (a fork's pull request): there is
    # no cluster, and the empty ID would fail the shutdown step.
    if: ${{ always() && needs.setup-database.result != 'skipped' }}
    # Pinned for the same reason as setup-database.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install .

      - name: Drop database
        if: ${{ always() }}
        # The password reaches the script through the environment rather than
        # being interpolated into the command, so the shell never sees its
        # characters.
        run: |
          python resources/drop_db.py --user admin --password "$CLUSTER_PASSWORD" --host "$CLUSTER_HOST" --port 3306 --database "$CLUSTER_DATABASE"
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLUSTER_PASSWORD: ${{ secrets.CLUSTER_PASSWORD }}
          CLUSTER_HOST: ${{ needs.setup-database.outputs.cluster-host }}
          CLUSTER_DATABASE: ${{ needs.setup-database.outputs.cluster-database }}

      - name: Shutdown cluster
        if: ${{ always() }}
        # An empty ID would send the DELETE to /v2/clusters/ and leave a live
        # cluster behind, so fail loudly instead; the ID then has to be recovered
        # by hand. --fail-with-body makes a refused DELETE fail this step rather
        # than print the error and exit 0.
        run: |
          if [ -z "$CLUSTER_ID" ]; then
            echo "::error::No cluster ID from setup-database; the cluster (if any) must be terminated by hand"
            exit 1
          fi
          curl --fail-with-body -H "Accept: application/json" -H "Authorization: Bearer ${{ secrets.CLUSTER_API_KEY }}" -X DELETE "https://api.singlestore.com/v2/clusters/$CLUSTER_ID?force=true"
        env:
          CLUSTER_ID: ${{ needs.setup-database.outputs.cluster-id }}
